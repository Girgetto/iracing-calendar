name: Update iRacing season data

# Keeps data/iracing-season-data.json in sync with the official iRacing season
# schedule, and rolls the calendar over on its own when a new season starts.
#
# Source: the official schedule PDF, which iRacing publishes at a stable,
# PUBLIC, unauthenticated URL:
#
#   https://members-assets.iracing.com/public/schedulepdf/SeasonSchedule.pdf
#
# The filename carries no season, so the same URL serves whatever season is
# current — no credentials, and nothing to change at rollover.
#
# NOTE: this deliberately does NOT use the iRacing Data API. That API requires
# an OAuth client and iRacing has paused issuing new client IDs, which left
# this workflow silently skipping every run (and the calendar ~2 months stale).
# sync-season-data.js is kept for the day registration reopens — see
# watch-iracing-oauth.yml, which watches for exactly that.

on:
  schedule:
    # Daily at 06:00 UTC. Cheap, and it catches both a season rollover and the
    # mid-season schedule corrections iRacing occasionally republishes.
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Check for changes without committing"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-season-data
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        # pdf-parse is needed by extract-season-data.js.
        run: npm ci

      - name: Sync season data from the public schedule PDF
        id: sync
        run: |
          # pipefail matters: without it the exit status of the pipeline below
          # is tee's, so a failed sync would be reported as a green run. That
          # is exactly how the 2026 Season 4 parse regression went unnoticed
          # for days while the committed calendar stayed on Season 3.
          set -o pipefail

          DRY_FLAG=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            DRY_FLAG="--dry-run"
          fi

          # Any failure here (download, parse, or validation) fails the job on
          # purpose — a broken parse must never quietly commit a bad calendar.
          node sync-season-pdf.js $DRY_FLAG | tee sync.log

          if grep -q "::changed::" sync.log; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push updated data
        if: steps.sync.outputs.changed == 'true' && github.event.inputs.dry_run != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- data/iracing-season-data.json; then
            echo "No file changes to commit."
            exit 0
          fi

          SEASON=$(node -e "console.log(require('./data/iracing-season-data.json').metadata.season)")
          git add data/iracing-season-data.json
          git commit -m "chore(data): sync iRacing season data ($SEASON)"
          git push

      - name: Summary
        if: always()
        run: |
          {
            echo "### iRacing season data sync"
            echo ""
            if [ "${{ steps.sync.outputs.changed }}" = "true" ]; then
              if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
                echo "Changes detected (dry-run — nothing committed)."
              else
                echo "Season data updated and committed."
              fi
            else
              echo "Already up to date — no changes."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
